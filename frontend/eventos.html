<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageFlow - Panel de Logística</title>
    <!-- Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
</head>
<body>
    
    <!-- BARRA DE NAVEGACIÓN ORIGINAL -->
    <nav class="navbar is-black" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item has-text-weight-bold is-size-4" href="index.html">
                    ⚡ StageFlow
                </a>
            </div>
            
            <div class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item" href="index.html">Inicio</a>
                    <a class="navbar-item is-active" href="eventos.html">Logística General</a>
                    <a class="navbar-item" href="nosotros.html">Nosotros</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CUERPO PRINCIPAL EN COLUMNAS -->
    <section class="section">
        <div class="container">
            <div class="columns is-desktop">
                
                <!-- SECCIÓN IZQUIERDA: GESTIÓN DE ARTISTAS -->
                <div class="column is-one-third-desktop">
                    <!-- Formulario de Artistas -->
                    <div class="box">
                        <h2 class="title is-4 has-text-centered">✨ Registrar Artista</h2>
                        <form id="form-artista">
                            <div class="field">
                                <label class="label">Nombre de la Banda / Artista:</label>
                                <div class="control">
                                    <input class="input" type="text" id="nombre-artista" placeholder="Ej: Duki" required>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Género Musical:</label>
                                <div class="control">
                                    <input class="input" type="text" id="genero-artista" placeholder="Ej: Trap / Rock" required>
                                </div>
                            </div>

                            <div class="field">
                                <button type="submit" class="button is-link is-fullwidth has-text-weight-bold">
                                    GUARDAR ARTISTA
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Lista de Artistas Disponibles -->
                    <div class="box">
                        <h3 class="subtitle is-5 has-text-weight-bold">🎵 Artistas Disponibles</h3>
                        <div id="lista-artistas" style="max-height: 300px; overflow-y: auto;">
                            <!-- Los artistas cargados en la base de datos aparecerán acá en forma de lista compacta -->
                            <p class="has-text-grey-light is-italic">Cargando artistas...</p>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN DERECHA: RESERVA DE EVENTOS -->
                <div class="column is-two-thirds-desktop">
                    <div class="box">
                        <h2 class="title is-3 has-text-centered">🗓️ Reservar Evento</h2>
                        
                        <form id="form-evento">
                            <!-- Nombre -->
                            <div class="field">
                                <label class="label">Nombre del Evento / Show:</label>
                                <div class="control">
                                    <input class="input" type="text" id="nombre" name="nombre" placeholder="Ej: Festival Rock Verano" required>
                                </div>
                            </div>

                            <!-- Lugar -->
                            <div class="field">
                                <label class="label">Lugar / Estadio:</label>
                                <div class="control">
                                    <input class="input" type="text" id="lugar" name="lugar" placeholder="Ej: Estadio River Plate" required>
                                </div>
                            </div>

                            <!-- Rango de Tiempo adaptado a DATETIME -->
                            <div class="columns">
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Inicio (Fecha y Hora):</label>
                                        <div class="control">
                                            <input class="input" type="datetime-local" id="start-time" name="start_time" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Fin (Fecha y Hora):</label>
                                        <div class="control">
                                            <input class="input" type="datetime-local" id="end-time" name="end_time" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Planilla de Equipo Técnico Requerido -->
                            <div class="field">
                                <label class="label">Planilla de Equipo Técnico:</label>
                                <div class="box" style="max-height: 120px; overflow-y: auto;">
                                    <div class="control">
                                        <label class="checkbox is-block mb-2">
                                            <input type="checkbox" name="equipo" value="Sonido Profesional"> 🔊 PA / Sonido Profesional
                                        </label>
                                        <label class="checkbox is-block mb-2">
                                            <input type="checkbox" name="equipo" value="Iluminación Robótica"> 💡 Iluminación Robótica / LED
                                        </label>
                                        <label class="checkbox is-block mb-2">
                                            <input type="checkbox" name="equipo" value="Pantallas LED"> 🖥️ Pantallas LED Gigantes
                                        </label>
                                        <label class="checkbox is-block mb-2">
                                            <input type="checkbox" name="equipo" value="Estructura Escenario"> 🏗️ Estructura / Tarimas
                                        </label>
                                        <label class="checkbox is-block">
                                            <input type="checkbox" name="equipo" value="Generador Eléctrico"> ⚡ Grupo Electrógeno
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="field mt-5">
                                <button type="submit" class="button is-primary is-fullwidth has-text-weight-bold">
                                    CONFIRMAR RESERVA
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- SECCIÓN CRONOGRAMA DE EVENTOS -->
    <section class="section has-background">
        <div class="container">
            <h3 class="title is-4">📋 Cronograma de Eventos Reservados</h3>
            <div id="contenedor-eventos" class="columns is-multiline">
                <!-- Las tarjetas de eventos se inyectarán acá -->
            </div>
        </div>
    </section>

    <!-- FOOTER SIMPLE -->
    <footer class="footer has-background-black has-text-white-ter py-5">
        <div class="content has-text-centered">
            <p>
                <strong class="has-text-white">StageFlow</strong> - Proyecto de Gestión de Eventos © 2026.
            </p>
        </div>
    </footer>

    <!-- Script de lógica -->
    <script src="js/eventos.js"></script>
</body>
</html>
